<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="940" height="210" fill="#f7f9fc"/>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">识别流程：从一张图片到可校对的结构化字段</text>

  <!-- 阶段 1 -->
  <rect x="20" y="60" width="150" height="100" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">图片输入</text>
  <text x="95" y="124" text-anchor="middle" font-size="12" fill="#334155">单张 / 批量</text>
  <text x="95" y="144" text-anchor="middle" font-size="12" fill="#334155">png·jpg·bmp·tif</text>

  <path d="M170 110 H196" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 阶段 2 -->
  <rect x="200" y="60" width="170" height="100" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">文字检测 + 识别</text>
  <text x="285" y="124" text-anchor="middle" font-size="12" fill="#334155">PP-OCRv6</text>
  <text x="285" y="144" text-anchor="middle" font-size="12" fill="#334155">onnxruntime（CPU）</text>

  <path d="M370 110 H396" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 阶段 3 -->
  <rect x="400" y="60" width="170" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">字段规则抽取</text>
  <text x="485" y="118" text-anchor="middle" font-size="11.5" fill="#14532d">姓名 性别 民族</text>
  <text x="485" y="136" text-anchor="middle" font-size="11.5" fill="#14532d">出生 住址 公民身份号码</text>
  <text x="485" y="154" text-anchor="middle" font-size="11.5" fill="#14532d">规则 + 可选 LLM 混合</text>

  <path d="M570 110 H596" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 阶段 4 -->
  <rect x="600" y="60" width="170" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="685" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">校验加固</text>
  <text x="685" y="118" text-anchor="middle" font-size="11.5" fill="#7c2d12">MOD 11-2 校验位</text>
  <text x="685" y="136" text-anchor="middle" font-size="11.5" fill="#7c2d12">跨字段一致性</text>
  <text x="685" y="154" text-anchor="middle" font-size="11.5" fill="#7c2d12">未知类型闸门</text>

  <path d="M770 110 H796" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- 阶段 5 -->
  <rect x="800" y="60" width="120" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">可视化</text>
  <text x="860" y="124" text-anchor="middle" font-size="12" fill="#334155">对照 + 留痕</text>
  <text x="860" y="144" text-anchor="middle" font-size="12" fill="#334155">导出 CSV</text>

  <text x="470" y="196" text-anchor="middle" font-size="12.5" fill="#64748b">每个阶段均在本地完成，识别过程不联网、数据不出本机。</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
